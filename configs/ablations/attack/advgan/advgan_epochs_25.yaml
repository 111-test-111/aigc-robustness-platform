# AdvGAN 训练轮数消融：少轮数
task:
  name: advgan_epochs_25
  seeds: [42, 123, 456, 789, 1024]
  device: auto

dataset:
  name: imagenet_subset
  root: data/raw/imagenet_subset/images
  manifest: data/raw/imagenet_subset/manifest.csv
  num_samples: 500
  image_size: 224
  batch_size: 16
  download: false
  strict_labels: true

target_model:
  type: classifier
  name: resnet50
  weights: imagenet

attacks:
  - name: advgan
    eps: 0.03
    epochs: 25
    lr: 0.001

defenses: []

metrics:
  attack:
    - asr
    - queries
  defense:
    - robust_accuracy
    - clean_accuracy_drop

report:
  output_dir: reports/advgan_epochs_25
  formats:
    - markdown
