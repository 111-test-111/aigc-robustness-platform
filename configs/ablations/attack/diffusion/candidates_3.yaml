# 扩散攻击 num_candidates 消融：少候选数
task:
  name: diffusion_candidates_3
  seeds: [42, 123, 456, 789, 1024]
  device: auto

dataset:
  name: imagenet_subset
  root: data/raw/imagenet_subset/images
  manifest: data/raw/imagenet_subset/manifest.csv
  num_samples: 200
  image_size: 512
  batch_size: 4
  download: false
  strict_labels: true

target_model:
  type: classifier
  name: resnet50
  weights: imagenet

attacks:
  - name: diffusion
    backend: sd
    generator: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a high quality photo"
    strength: 0.7
    guidance_scale: 7.5
    num_candidates: 3

defenses: []

metrics:
  attack:
    - asr
    - queries
  quality:
    - lpips
    - clip_score
    - fid

report:
  output_dir: reports/diffusion_candidates_3
  formats:
    - markdown
