# 防御消融实验 - 无防御基线
task:
  name: defense_ablation_no_defense
  seed: 42
  device: auto

dataset:
  name: imagenet_subset
  root: data/raw/imagenet_subset/images
  manifest: data/raw/imagenet_subset/manifest.csv
  num_samples: 100
  image_size: 224
  batch_size: 16
  download: false
  strict_labels: true

target_model:
  type: classifier
  name: resnet50
  weights: imagenet

attacks:
  - name: fgsm
    eps: 0.03
  - name: pgd
    eps: 0.03
    alpha: 0.007
    steps: 20

defenses: []

metrics:
  attack:
    - asr
    - queries
  defense:
    - robust_accuracy
    - clean_accuracy_drop

report:
  output_dir: reports/defense_ablation_no_defense
  formats:
    - markdown
