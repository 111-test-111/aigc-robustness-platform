# ViT-B/16 — Diffusion 攻击 × 全部防御（Phase 1）
# 原始 vit_b_16_baseline 的 Part C: 1 attack × 4 defenses = 4 combos
task:
  name: vit_b_16_diffusion
  seeds: [42, 123, 456, 789, 1024]
  device: auto

dataset:
  name: imagenet_subset
  root: data/raw/imagenet_subset/images
  manifest: data/raw/imagenet_subset/manifest.csv
  num_samples: 200
  image_size: 512
  batch_size: 4
  download: false
  strict_labels: true

target_model:
  type: classifier
  name: vit_b_16
  weights: imagenet

attacks:
  - name: diffusion
    backend: sd
    generator: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a high quality photo"
    strength: 0.7
    guidance_scale: 7.5
    num_candidates: 5

defenses:
  - name: jpeg
    quality: 75
  - name: gaussian_blur
    kernel_size: 5
    sigma: 1.0
  - name: bit_depth
    bits: 4
  - name: diffusion_purification
    backend: sd
    model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
    noise_level: 0.1
    steps: 50

metrics:
  attack:
    - asr
    - queries
  quality:
    - lpips
    - clip_score
    - fid
  defense:
    - robust_accuracy
    - clean_accuracy_drop
    - latency

report:
  output_dir: reports/vit_b_16_baseline/diffusion
  formats:
    - markdown
