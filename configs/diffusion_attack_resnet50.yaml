task:
  name: diffusion_attack_resnet50
  seed: 42
  device: cuda

dataset:
  name: cifar10
  root: data/raw/cifar10
  num_samples: 50
  image_size: 512

target_model:
  type: classifier
  name: resnet50
  weights: imagenet

attacks:
  - name: fgsm
    eps: 0.03
  - name: pgd
    eps: 0.03
    alpha: 0.007
    steps: 20
  - name: diffusion
    generator: stable-diffusion-v1-5/stable-diffusion-v1-5
    prompt: "a high quality photo"
    strength: 0.7
    guidance_scale: 7.5
    num_candidates: 5

defenses:
  - name: jpeg
    quality: 75
  - name: diffusion_purification
    noise_level: 0.1
    steps: 50

metrics:
  attack:
    - asr
    - queries
  quality:
    - lpips
    - clip_score
  defense:
    - robust_accuracy
    - clean_accuracy_drop
    - latency

report:
  output_dir: reports/diffusion_attack_resnet50
  formats:
    - markdown
