[project]
name = "aigc-robustness-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "kornia>=0.7",
    "omegaconf>=2.3",
    "typer>=0.9",
    "Pillow>=10.0",
    "numpy>=1.24",
    "lpips>=0.1.4",
    "torchmetrics[image]>=1.0",
    "torchmetrics[multimodal]>=1.0",
    "transformers>=4.30",
    "diffusers>=0.20",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end integration tests (deselect with '-m not integration')",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
